name: KM-Portal CI

on:
  push:
    paths:
      - 'ksv-km-meldeportal/**'
      - '.github/workflows/kmm-ci.yml'
  pull_request:
    paths:
      - 'ksv-km-meldeportal/**'
  workflow_dispatch:

jobs:
  # Derselbe Commit kommt meist zweimal vorbei: erst auf dem Arbeitszweig, dann auf main.
  # Auf main wird deshalb nachgesehen, ob ein früherer Lauf dieses Workflows denselben
  # Commit schon erfolgreich geprüft hat; dann entfällt die Prüfung hier. Läuft der frühere
  # Lauf noch, wird auf sein Ergebnis gewartet – ein grüner Lauf auf main heißt also immer,
  # dass der Commit wirklich geprüft und in Ordnung ist. War der frühere Lauf rot oder
  # schlägt die Nachfrage fehl, wird hier geprüft.
  schon-geprueft:
    name: Schon geprüft?
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      ueberspringen: ${{ steps.suche.outputs.ueberspringen }}
    steps:
      - name: Früheren Lauf für denselben Commit suchen
        id: suche
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Antwortet "gut …", "laeuft …" oder "nichts" für die früheren Läufe dieses Commits.
          frage() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/kmm-ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100" 2>/dev/null \
              | jq -r --argjson ich "$GITHUB_RUN_ID" --argjson nr "$GITHUB_RUN_NUMBER" '
                [.workflow_runs[]? | select(.id != $ich and .run_number < $nr)] as $frueher
                | ([$frueher[] | select(.status == "completed" and .conclusion == "success")] | first) as $gut
                | ([$frueher[] | select(.status != "completed")] | first) as $laeuft
                | if $gut then "gut #\($gut.run_number) auf \($gut.head_branch)"
                  elif $laeuft then "laeuft #\($laeuft.run_number) auf \($laeuft.head_branch)"
                  else "nichts" end' 2>/dev/null || true
          }
          stand=nichts
          # Höchstens sechs Minuten auf einen laufenden früheren Lauf warten.
          for i in $(seq 1 36); do
            stand=$(frage)
            stand=${stand:-nichts}
            case "$stand" in
              laeuft*)
                if [ "$i" = 1 ]; then echo "Warte auf das Ergebnis von Lauf ${stand#laeuft }."; fi
                sleep 10 ;;
              *) break ;;
            esac
          done
          case "$stand" in
            gut*)
              echo "ueberspringen=true" >> "$GITHUB_OUTPUT"
              echo "Dieser Commit wird nicht noch einmal geprüft: Lauf ${stand#gut } hat ihn erfolgreich geprüft." | tee -a "$GITHUB_STEP_SUMMARY" ;;
            *)
              echo "ueberspringen=false" >> "$GITHUB_OUTPUT"
              echo "Kein früherer Lauf hat diesen Commit erfolgreich geprüft – es wird geprüft." ;;
          esac

  check:
    name: Lint, PHPStan, PHPUnit
    needs: schon-geprueft
    # Läuft auch, wenn die Vorprüfung entfällt (Arbeitszweig, Pull Request, Handstart) oder scheitert.
    if: ${{ !cancelled() && needs.schon-geprueft.outputs.ueberspringen != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ksv-km-meldeportal
    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3 einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, mysqli
          coverage: none
          tools: composer:v2

      - name: Composer-Cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('ksv-km-meldeportal/composer.lock') }}

      - name: Abhängigkeiten installieren
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint
        run: composer lint

      - name: PHPStan
        run: composer stan

      - name: PHPUnit (Unit-Tests; Integrationstests ohne KMM_WP_ROOT übersprungen)
        run: composer test

      - name: ZIP bauen (Probelauf)
        run: bash tools/build-zip.sh

      - name: ZIP als Artefakt bereitstellen (zum Testen ohne Deploy)
        uses: actions/upload-artifact@v4
        with:
          name: ksv-km-meldeportal-zip
          path: ksv-km-meldeportal/build/*.zip
          retention-days: 14
