name: Deploy via FTP

on:
  push:
    branches: [ main ]     # ggf. anpassen
  workflow_dispatch:       # manuell auslösbar

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ftp-deploy-prod
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Falls du vorher baust (z.B. React/Vue/etc.):
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: 20
      # - run: npm ci && npm run build

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp                 # <— Standard FTP
          port: 21                      # Standard FTP-Port
          local-dir: ./srd-kreismeisterschaften/                 # Root-Verzeichnis des Repositories
          server-dir: /          # Zielpfad auf deinem Server anpassen
          exclude: |                    # Dateien die NICHT hochgeladen werden sollen
            **/.git*
            **/.github/**
            **/node_modules/**
            **/*.map
            **/.DS_Store
            **/README.md
            **/*.md
          dangerous-clean-slate: false  # Vorsicht: löscht alles im Zielverzeichnis
          timeout: 300000               # 5 Minuten Timeout
          # dry-run: true               # erst testen, dann auskommentieren

  deploy-meldeportal:
    name: KM-Meldeportal per FTP
    runs-on: ubuntu-latest
    concurrency:
      group: ftp-deploy-meldeportal
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.3 einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      # Laufzeit-Abhängigkeiten (vendor/ ohne Dev-Pakete) werden mit ausgeliefert,
      # auf dem Shared Hosting läuft kein Composer.
      - name: Composer (ohne Dev-Pakete)
        working-directory: ksv-km-meldeportal
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      # Nur die DejaVu-Schriften werden gebraucht; die übrigen 80 MB mPDF-Schriften entfallen.
      - name: mPDF-Schriften verkleinern
        working-directory: ksv-km-meldeportal
        run: find vendor/mpdf/mpdf/ttfonts -type f ! -name 'DejaVu*' -delete

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          port: 21
          local-dir: ./ksv-km-meldeportal/
          # Zielordner des Meldeportals relativ zum FTP-Root, als Repository-Variable
          # KMM_FTP_SERVER_DIR setzen (z. B. /../ksv-km-meldeportal/ oder
          # /wp-content/plugins/ksv-km-meldeportal/), Standard: /ksv-km-meldeportal/
          server-dir: ${{ vars.KMM_FTP_SERVER_DIR || '/ksv-km-meldeportal/' }}
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/*.map
            **/.DS_Store
            **/*.md
            docs/**
            tools/**
            tests/**
            build/**
            phpunit.xml.dist
            phpstan.neon.dist
            composer.json
            composer.lock
            .gitignore
          dangerous-clean-slate: false
          timeout: 300000
